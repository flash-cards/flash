# Contributor license agreement check on pull requests to the public
# repository (see CLA.md). Signatures are kept on the `cla-signatures`
# branch by the action itself. Inert in the private monorepo.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# `contents: write` is what lets the action record a signature on the
# signatures branch; protect `main` with a ruleset so that is the only
# branch the token can reach. It does not need to touch workflow runs.
permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      !github.event.repository.private &&
      (github.event_name == 'pull_request_target' ||
       (github.event.issue.pull_request && contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: dependabot[bot]
