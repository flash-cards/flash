# Dependency vulnerability scan: runs on every push/PR that touches the
# lockfile, and daily so newly published RustSec advisories against
# already-locked versions still get flagged.
name: cargo audit

on:
  push:
    paths: ["Cargo.lock", "Cargo.toml", "crates/**/Cargo.toml", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["Cargo.lock", "Cargo.toml", "crates/**/Cargo.toml"]
  schedule:
    - cron: "17 9 * * *"   # daily, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # the action opens/updates an issue when the scheduled run finds something

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
